version: '3.8'

services:
  backend-api:
    build: ./backend-api
    container_name: webgen-ai-backend-api
    ports:
      - "8010:8000"
    environment:
      - AI_ENGINE_URL=http://webgen-ai-ai-engine:5005
    depends_on:
      - ai-engine
    networks:
      - webnet

  ai-engine:
    build: ./ai-engine
    container_name: webgen-ai-ai-engine
    ports:
      - "5005:5005"
    environment:
      - OLLAMA_URL=http://127.0.0.1:11434
    networks:
      - webnet

  frontend:
    build: ./frontend
    container_name: webgen-ai-frontend
    ports:
      - "8090:80"
    depends_on:
      - backend-api
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
