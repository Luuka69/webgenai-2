services:
  backend-api:
    build: ./backend
    container_name: webgen-ai-backend-api
    ports:
      - "8100:8000"
    environment:
      - OLLAMA_API=http://webgen-ai-ai-engine:5005
    networks:
      - webnet

  ai-engine:
    build: ./ai-engine
    container_name: webgen-ai-ai-engine
    ports:
      - "8505:5005"
    networks:
      - webnet

  frontend:
    build: ./frontend
    container_name: webgen-ai-frontend
    ports:
      - "8090:80"
    depends_on:
      - backend-api
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
