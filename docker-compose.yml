version: '3.8'

services:
  backend-api:
    build: ./backend-api
    container_name: webgen-ai-backend-api
    ports:
      - "8100:8000"
    environment:
      - AI_ENGINE_URL=http://ai-engine:5005
    depends_on:
      - ai-engine
      - ollama
    networks:
      - webnet

  ai-engine:
    build: ./ai-engine
    container_name: webgen-ai-ai-engine
    ports:
      - "8505:5005"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
    depends_on:
      - ollama
    networks:
      - webnet

  frontend:
    build: ./frontend
    container_name: webgen-ai-frontend
    ports:
      - "8090:80"
    depends_on:
      - backend-api
    networks:
      - webnet

  ollama:
    image: ollama/ollama:latest
    container_name: webgen-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

volumes:
  ollama-data:
